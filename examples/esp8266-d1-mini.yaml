esphome:
  name: zenner-nfc-d1-mini
  friendly_name: Zenner water meter

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: INFO

external_components:
  - source:
      type: local
      path: ../components
    components: [zenner_nfc]

i2c:
  id: nfc_i2c
  sda: D2
  scl: D1
  frequency: 100kHz
  scan: true

zenner_nfc:
  id: water_meter
  reader: pn532
  pn532_interface: i2c
  i2c_id: nfc_i2c
  update_interval: 60s
  consecutive_errors_limit: 3
  forward_volume:
    name: Water consumption
  flow:
    name: Water flow
    unit_of_measurement: L/min
  water_temperature:
    name: Water temperature
  ambient_temperature:
    name: Ambient temperature
  read_success:
    name: Last read successful
  status:
    name: Read status
  uid:
    name: NFC UID